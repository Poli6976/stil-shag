<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Силуэты — эскизы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #111;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    padding: 40px 5vw 80px;
  }
  .wall-label { max-width: 640px; margin: 0 auto 40px; text-align: center; }
  .wall-label h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2.2rem;
    letter-spacing: 0.08em;
  }
  .wall-label p {
    margin-top: 12px;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888;
  }
  .plates {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 40px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .plate { text-align: center; }
  .plate svg { width: 100%; height: auto; max-height: 460px; }
  .plate figcaption { margin-top: 18px; }
  .plate .num {
    display: block;
    font-size: 0.64rem;
    letter-spacing: 0.32em;
    color: #bbb;
    margin-bottom: 6px;
  }
  .plate .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
  }
  .plate .desc {
    margin-top: 5px;
    font-size: 0.68rem;
    line-height: 1.6;
    color: #999;
  }
</style>
</head>

<div class="wall-label">

  <p>Эскизы силуэта</p>
</div>

</div>
